<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cliente - Patitas Pet Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="dashboard-encabezado">
        <div class="dashboard-contenedor">
            <h1>Patitas Pet Shop</h1>
            <p>Panel administrativo</p>

            <nav class="menu">
                <ul>
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="citas.html">Citas</a></li>
                    <li><a href="index.html">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-principal">
        <section class="panel formulario-seccion">
            <header class="encabezado-pagina">
                <div>
                    <h2>Formulario de cliente</h2>
                    <p>Utiliza este formulario para registrar o modificar un cliente.</p>
                </div>

                <a class="boton boton-pequeno" href="clientes.html">Volver a clientes</a>
            </header>

            <form class="formulario-cliente" action="#" method="post">
                <fieldset>
                    <legend>Datos del cliente y su mascota</legend>

                    <div class="campo">
                        <label for="nombre-cliente">Nombre completo</label>
                        <input type="text" id="nombre-cliente" name="nombre-cliente" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                    <div class="campo">
                        <label for="correo-cliente">Correo electrónico</label>
                        <input type="email" id="correo-cliente" name="correo-cliente" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="nombre-mascota">Nombre de la mascota</label>
                        <input type="text" id="nombre-mascota" name="nombre-mascota" required>
                    </div>

                    <div class="campo">
                        <label for="tipo-mascota">Tipo de mascota</label>
                        <select id="tipo-mascota" name="tipo-mascota" required>
                            <option value="">Selecciona una opción</option>
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                            <option value="ave">Ave</option>
                            <option value="pez">Pez</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <button class="boton" type="submit">Guardar cliente</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Maestría en Ingeniería de Software Avanzada</p>
    </footer>
</body>
</html>
