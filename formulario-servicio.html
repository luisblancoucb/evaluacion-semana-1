<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de servicio - Patitas Pet Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="dashboard-encabezado">
        <div class="dashboard-contenedor">
            <h1>Patitas Pet Shop</h1>
            <p>Panel administrativo</p>

            <nav class="menu">
                <ul>
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="citas.html">Citas</a></li>
                    <li><a href="index.html">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-principal">
        <section class="panel formulario-seccion">
            <header class="encabezado-pagina">
                <div>
                    <h2>Formulario de servicio</h2>
                    <p>Utiliza este formulario para registrar o modificar un servicio.</p>
                </div>

                <a class="boton boton-pequeno" href="servicios.html">Volver a servicios</a>
            </header>

            <form class="formulario-datos" action="#" method="post">
                <fieldset>
                    <legend>Datos del servicio</legend>

                    <div class="campo">
                        <label for="nombre-servicio">Nombre del servicio</label>
                        <input type="text" id="nombre-servicio" name="nombre-servicio" required>
                    </div>

                    <div class="campo">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" required></textarea>
                    </div>

                    <div class="campo">
                        <label for="precio">Precio en bolivianos</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                    </div>

                    <div class="campo">
                        <label for="duracion">Duración en minutos</label>
                        <input type="number" id="duracion" name="duracion" min="1" required>
                    </div>

                    <div class="campo">
                        <label for="estado-servicio">Estado</label>
                        <select id="estado-servicio" name="estado-servicio" required>
                            <option value="">Selecciona una opción</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <button class="boton" type="submit">Guardar servicio</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Maestría en Ingeniería de Software Avanzada</p>
    </footer>
</body>
</html>
